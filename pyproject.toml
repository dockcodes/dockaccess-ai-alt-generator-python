[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "dockaccess-alt-generator"
dynamic = ["version"]
description = "Alt text for images from the dockaccess.org AI alt generator: a safe sync and async client, a CLI for pipelines and helpers for FastAPI, Django and Flask."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Dock sp. z o.o." }]
keywords = ["alt text", "accessibility", "a11y", "wcag", "images", "ai", "dockaccess", "fastapi", "django", "flask"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: AsyncIO",
    "Framework :: Django",
    "Framework :: FastAPI",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<1",
    "pillow>=10.3",
]

[project.optional-dependencies]
heif = ["pillow-heif>=0.18"]
fastapi = ["fastapi>=0.100"]
django = ["django>=4.2"]
flask = ["flask>=2.3"]

[project.scripts]
dockaccess-alt = "dockaccess_alt.cli:main"

[project.urls]
Homepage = "https://dockaccess.org/plugins/alt-generator/python/"
Documentation = "https://dockaccess.org/documentation/alt-generator/python/"
Source = "https://github.com/dockcodes/dockaccess-ai-alt-generator-python"
Changelog = "https://github.com/dockcodes/dockaccess-ai-alt-generator-python/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/dockaccess_alt/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dockaccess_alt"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "CHANGELOG.md", "SECURITY.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["network: calls the real dockaccess.org services (DOCKACCESS_ALT_NETWORK_TESTS=1)"]
filterwarnings = [
    "error::DeprecationWarning:dockaccess_alt.*",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src"]

[[tool.mypy.overrides]]
module = ["pillow_heif", "django.*", "flask.*", "fastapi.*", "starlette.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF"]
ignore = ["S101", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108", "S603", "S607", "B017", "E501"]
